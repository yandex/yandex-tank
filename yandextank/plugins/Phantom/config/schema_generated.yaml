# Сгенерировано из schema.py, руками не править.
# Перегенерация: python3 -m yandextank.plugins.Phantom.config.generate_schema_yaml
additional_libs:
  default: []
  description: Libs for Phantom, to be added to phantom config file in section "module_setup"
  schema:
    type: string
  type: list
address:
  description: 'Address of target. Format: [host]:port, [ipv4]:port, [ipv6]:port.
    Port is optional. Tank checks each test if port is available'
  empty: false
  examples:
    127.0.0.1:8080: ''
    www.w3c.org: ''
  required: true
  type: string
affinity:
  default: ''
  description: Use to set CPU affinity
  examples:
    0,1,2,16,17,18: enable 6 specified cores
    0-3: enable first 4 cores
  type: string
ammo_limit:
  default: -1
  description: Sets the upper limit for the total number of requests
  type: integer
ammo_type:
  allowed:
  - phantom
  - uri
  - uripost
  - access
  default: phantom
  description: Ammo format. Don't forget to change ammo_type option if you switch
    the format of your ammo, otherwise you might get errors
  tutorial_link: http://yandextank.readthedocs.io/en/latest/tutorial.html#preparing-requests
  type: string
  values_description:
    access: Use access.log from your web server as a source of requests
    phantom: Use Request-style file. Most versatile, HTTP as is. See tutorial for
      details
    uri: Use URIs listed in file with headers. Simple but allows for GET requests
      only. See tutorial for details
    uripost: Use URI-POST file. Allows POST requests with bodies. See tutorial for
      details
ammofile:
  default: ''
  description: Path to ammo file. Ammo file contains requests to be sent to a server.
    Can be gzipped
  tutorial_link: http://yandextank.readthedocs.io/en/latest/tutorial.html#preparing-requests
  type: string
autocases:
  anyof:
  - type: integer
  - allowed:
    - uri
    - uniq
    type: string
  default: 0
  description: Use to automatically tag requests. Requests might be grouped by tag
    for later analysis.
  examples:
    2: /example/search/hello/help/us?param1=50 -> _example_search
    3: /example/search/hello/help/us?param1=50 -> _example_search_hello
    uri: /example/search/hello/help/us?param1=50 -> _example_search_hello_help_us
    uniq: /example/search/hello/help/us?param1=50 -> c98b0520bb6a451c8bc924ed1fd72553
  values_description:
    <N>: use N first uri parts to tag request, slashes are replaced with underscores
    uniq: tag each request with unique uid
    uri: tag each request with its uri path, slashes are replaced with underscores
buffered_seconds:
  default: 2
  description: Aggregator latency
  type: integer
cache_dir:
  default: null
  description: stpd-file cache directory
  nullable: true
  type: string
chosen_cases:
  default: ''
  description: Use only selected cases.
  type: string
client_certificate:
  default: ''
  description: Path to client SSL certificate
  type: string
client_cipher_suites:
  default: ''
  description: Cipher list, consists of one or more cipher strings separated by colons
    (see man ciphers)
  type: string
client_key:
  default: ''
  description: Path to client's certificate's private key
  type: string
config:
  default: ''
  description: Use ready phantom config instead of generated
  type: string
connection_test:
  default: true
  description: Test TCP socket connection before starting the test
  type: boolean
enum_ammo:
  default: false
  type: boolean
file_cache:
  default: 8192
  type: integer
force_stepping:
  default: 0
  description: Ignore cached stpd files, force stepping
  type: integer
gatling_ip:
  default: ''
  type: string
header_http:
  allowed:
  - '1.0'
  - '1.1'
  default: '1.0'
  description: HTTP version
  type: string
  values_description:
    '1.0': http 1.0
    '1.1': http 1.1
headers:
  default: []
  description: HTTP headers
  schema:
    description: 'Format: "Header: Value"'
    examples:
      'accept: text/html': ''
    type: string
  type: list
instances:
  default: 1000
  description: Max number of concurrent clients.
  type: integer
load_profile:
  description: Configure your load setting the number of RPS or instances (clients)
    as a function of time,or using a prearranged schedule
  required: true
  schema:
    load_type:
      allowed:
      - rps
      - instances
      - stpd_file
      description: Choose control parameter
      required: true
      type: string
      values_description:
        instances: control the number of instances
        rps: control the rps rate
        stpd_file: use prearranged schedule file
    schedule:
      check_with: load_scheme
      description: load schedule or path to stpd file
      examples:
        const(200,90s): constant load of 200 instances/rps during 90s
        line(100,200,10m): linear growth from 100 to 200 instances/rps during 10 minutes
        test_dir/test_backend.stpd: path to ready schedule file
      required: true
      type: string
  tutorial_link: http://yandextank.readthedocs.io/en/latest/tutorial.html#tutorials
  type: dict
loop:
  default: -1
  description: Loop over ammo file for the given amount of times.
  type: integer
method_options:
  default: ''
  description: Additional options for method objects. It is used for Elliptics etc.
  type: string
method_prefix:
  default: method_stream
  description: Object's type, that has a functionality to create test requests.
  type: string
multi:
  allow_unknown: true
  default: []
  schema:
    schema:
      additional_libs:
        description: Libs for Phantom, to be added to phantom config file in section
