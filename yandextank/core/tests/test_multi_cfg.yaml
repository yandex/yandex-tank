version: 1.8.36
core:
  operator: fomars
  lock_dir: "./"
telegraf:
  package: yandextank.plugins.Telegraf
  enabled: True
  config: test_monitoring.xml
  disguise_hostnames: True
phantom:
  package: yandextank.plugins.Phantom
  enabled: True
  # localhost, как в CFG1: в сборке нет DNS, а резолв мишени падает с
  # socket.gaierror и уносит тест. Проверяется обработка мультиконфига, не хост.
  address: localhost
  phantom_path: "./phantom_mock.sh"
  header_http: "1.1"
  uris: ["/"]
  loop: 100
  load_profile: {load_type: rps, schedule: "line(1, 10, 1m)"}
  connection_test: false
  multi:
  - address: localhost
    load_profile: {load_type: instances, schedule: "const(10, 1m)"}
    connection_test: false
